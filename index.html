<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Визитка Вячеслава</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; text-align: center; padding: 50px; }
        .card { background: white; max-width: 450px; margin: 0 auto; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #24292e; }
        p { color: #586069; font-size: 18px; line-height: 1.6; }
        .btn { display: inline-block; padding: 12px 24px; background: #2ea44f; color: white; text-decoration: none; border-radius: 6px; margin-top: 15px; font-weight: bold; }
        .btn:hover { background: #2c974b; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Привет! Я Вячеслав 👋</h1>
        <p>Это мой первый сайт-визитка, который работает абсолютно бесплатно на хостинге GitHub Pages!</p>
        <a href="https://github.com" class="btn">Мой GitHub профиль</a>
    </div>
</body>
</html>
